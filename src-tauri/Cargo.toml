[package]
name = "telecat"
version = "1.0.0"
description = "Open Source Teleprompter App"
authors = [ "MarcusUniverse" ]
license = "MIT"
repository = "https://github.com/NicolaSpadari/nuxtor"
edition = "2021"

[lib]
name = "nuxtor_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.4"
features = [ ]

[dependencies]
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-os = "2.3"
tauri-plugin-fs = "2.4"
tauri-plugin-store = "2.4"
serde_json = "1"
tokio = { version = "1.44.1", features = [ "full" ] }
tokio-tungstenite = "0.26.2"
futures-util = "0.3.31"
once_cell = "1.21.3"

[dependencies.tauri]
version = "2.4"
features = [ "tray-icon" ]

[dependencies.serde]
version = "1"
features = [ "derive" ]
